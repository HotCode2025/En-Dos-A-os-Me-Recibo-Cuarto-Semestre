name: e-commerce (tests)

# Solo corre los tests del backend. No hace build, deploy ni usa secrets.
on:
  push:
    paths:
      - 'e-commerce/**'
  pull_request:
    paths:
      - 'e-commerce/**'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-commerce/backend/package-lock.json
      - run: npm ci
      - run: npm test
